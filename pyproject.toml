[project]
name = "finetune-platform"
version = "0.1.0"
description = "Fine-Tuning Pipeline as a Service: upload data, validate, train, register, deploy, evaluate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "1morshed1" }]

# ---------------------------------------------------------------------------
# Core dependencies.
#
# These are intentionally *lightweight*. The whole platform runs on a laptop
# with no GPU. Heavy ML libraries (torch / transformers / peft / mlflow) live
# in the optional `ml` extra so the default install stays fast and portable.
# See docs/adr/0002-dependency-strategy.md for the reasoning.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",  # required by FastAPI for multipart file uploads
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real machine-learning backend. Only needed if you want to run an actual
# LoRA/QLoRA fine-tune instead of the default simulated trainer.
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "datasets>=2.19",
    "tiktoken>=0.7",
]
# Real experiment tracking / model registry backend (optional).
mlflow = ["mlflow>=2.13"]
# Development / test tooling.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
ftp = "ftp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: calling Depends()/File()/Form() in argument defaults is the correct,
# intended FastAPI idiom — not a bug. Ignore it project-wide.
ignore = ["B008", "E501"]  # E501: the formatter owns line length
